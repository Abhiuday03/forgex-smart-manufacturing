spring.application.name=forgex-backend

server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5050/forgex
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
#In terminal# $env:DB_PASSWORD="YOUR_POSTGRES_PASSWORD"


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.tool.schema=DEBUG

# Admin authentication
spring.security.user.name=${FORGEX_ADMIN_USERNAME}
spring.security.user.password=${FORGEX_ADMIN_PASSWORD}
#In terminal# $env:FORGEX_ADMIN_USERNAME = "forgex-admin"
#In terminal# $env:FORGEX_ADMIN_PASSWORD = Read-Host "Enter a strong admin password"